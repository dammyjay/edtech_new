<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Python Lab — Phase 0 Spike</title>
<style>
  :root { --brand: #A17807; --brand-dark: #4C3802; --bg: #f4f1ea; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: #2b2b2b; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px;
    background: linear-gradient(135deg, var(--brand), var(--brand-dark)); color: #fff;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .status { margin-left: auto; font-size: 13px; opacity: 0.9; }
  button {
    border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; background: #fff; color: var(--brand-dark);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  main { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane + .pane { border-left: 1px solid #ddd; }
  .pane-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #666;
    padding: 8px 12px; flex: none; background: #eee9dc;
  }
  #codeInput {
    flex: 1; border: none; padding: 12px; font: 14px/1.5 Consolas, monospace;
    resize: none; outline: none; background: #1e1e1e; color: #d4d4d4;
  }
  #consoleOutput {
    flex: 1; padding: 12px; font: 13px/1.6 Consolas, monospace; overflow-y: auto;
    background: #fff; white-space: pre-wrap; word-break: break-word;
  }
  .line-stdout { color: #2b2b2b; }
  .line-stderr { color: #d64545; }
  .line-meta { color: #888; font-style: italic; }
  footer { flex: none; padding: 8px 12px; font-size: 12px; color: #666; background: #eee9dc; }
</style>
</head>
<body>
  <header>
    <h1>Python Lab — Phase 0 Spike (Pyodide in a Web Worker)</h1>
    <button id="runBtn" disabled>Run</button>
    <span class="status" id="statusLine">Loading Pyodide…</span>
  </header>
  <main>
    <div class="pane">
      <div class="pane-label">Code</div>
      <textarea id="codeInput" spellcheck="false">import time

for i in range(5):
    print("count:", i)
    time.sleep(0.2)

print("done")
</textarea>
    </div>
    <div class="pane">
      <div class="pane-label">Output</div>
      <div id="consoleOutput"></div>
    </div>
  </main>
  <footer>
    Try the "Infinite loop" / "Import numpy" buttons below the editor via the console — or just edit the code and hit Run.
    <button id="infiniteLoopBtn" style="margin-left:8px;">Load infinite-loop example</button>
    <button id="numpyBtn">Load numpy example</button>
    <button id="errorBtn">Load traceback example</button>
  </footer>

<script>
  const RUN_TIMEOUT_MS = 10000;

  const runBtn = document.getElementById("runBtn");
  const statusLine = document.getElementById("statusLine");
  const consoleOutput = document.getElementById("consoleOutput");
  const codeInput = document.getElementById("codeInput");

  function appendLine(text, cls) {
    const line = document.createElement("div");
    line.className = cls;
    line.textContent = text; // textContent only — never innerHTML for output a student's code produced
    consoleOutput.appendChild(line);
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
  }

  let worker = null;
  let timeoutHandle = null;
  let running = false;

  function spawnWorker() {
    worker = new Worker("worker.js");
    worker.onmessage = (event) => {
      const msg = event.data;
      if (msg.type === "ready") {
        statusLine.textContent = `Ready (Pyodide loaded in ${msg.loadMs}ms)`;
        runBtn.disabled = false;
      } else if (msg.type === "init-error") {
        statusLine.textContent = "Failed to load Pyodide: " + msg.message;
        appendLine("[init error] " + msg.message, "line-stderr");
      } else if (msg.type === "stdout") {
        appendLine(msg.line, "line-stdout");
      } else if (msg.type === "stderr") {
        appendLine(msg.line, "line-stderr");
      } else if (msg.type === "done") {
        clearTimeout(timeoutHandle);
        running = false;
        runBtn.disabled = false;
        appendLine(`[finished in ${msg.runMs}ms]`, "line-meta");
        statusLine.textContent = "Ready";
      } else if (msg.type === "run-error") {
        clearTimeout(timeoutHandle);
        running = false;
        runBtn.disabled = false;
        appendLine(msg.message, "line-stderr");
        statusLine.textContent = "Ready (last run errored)";
      }
    };
    worker.onerror = (e) => {
      appendLine("[worker error] " + e.message, "line-stderr");
    };
    worker.postMessage({ type: "init" });
  }

  runBtn.addEventListener("click", () => {
    if (running) return;
    running = true;
    runBtn.disabled = true;
    consoleOutput.innerHTML = "";
    statusLine.textContent = "Running…";

    worker.postMessage({ type: "run", code: codeInput.value });

    // Wall-clock timeout — a worker can't be gracefully interrupted
    // mid-execution without SharedArrayBuffer (unavailable here, see plan
    // doc section 5.4), so a runaway loop gets killed and a fresh worker
    // spun up for the next Run.
    timeoutHandle = setTimeout(() => {
      appendLine(`[timed out after ${RUN_TIMEOUT_MS / 1000}s — terminating]`, "line-stderr");
      worker.terminate();
      running = false;
      statusLine.textContent = "Restarting after timeout…";
      spawnWorker();
    }, RUN_TIMEOUT_MS);
  });

  document.getElementById("infiniteLoopBtn").addEventListener("click", () => {
    codeInput.value = 'print("about to loop forever...")\nwhile True:\n    pass\n';
  });
  document.getElementById("numpyBtn").addEventListener("click", () => {
    codeInput.value =
      "import numpy as np\n\na = np.array([1, 2, 3, 4, 5])\nprint(\"array:\", a)\nprint(\"mean:\", a.mean())\nprint(\"squared:\", a ** 2)\n";
  });
  document.getElementById("errorBtn").addEventListener("click", () => {
    codeInput.value = "def boom():\n    return 1 / 0\n\nprint(\"before\")\nboom()\nprint(\"after (never reached)\")\n";
  });

  spawnWorker();
</script>
</body>
</html>
