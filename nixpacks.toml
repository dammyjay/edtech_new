# nixpacks.toml — Railway build customization.
#
# This repo had no custom Nixpacks config before Arduino Lab needed
# arduino-cli (a Go binary, not an npm package) on the built image.
#
# arduino-cli itself fetches its own AVR toolchain (avr-gcc, avrdude,
# board headers) via `arduino-cli core install arduino:avr` — that step
# runs once at app startup (app.js's ensureAvrCoreInstalled(), not here),
# since it needs network access and only has to happen once per running
# container, not at build time. This file only needs to get the
# arduino-cli binary itself onto the image.
#
# Originally this pulled arduino-cli straight from nixpkgs
# (nixPkgs = ["arduino-cli"]). That built fine but broke at *runtime* —
# every arduino-cli invocation failed with
# "bwrap: Creating new namespace failed: Operation not permitted",
# on the very first command (core update-index), before anything
# toolchain-related had even run. Root cause: nixpkgs' arduino-cli
# derivation is wrapped via buildFHSEnv (so it can later run the
# non-Nix, dynamically-linked avr-gcc/avrdude binaries it downloads,
# which expect a standard /lib64-style filesystem Nix doesn't have) —
# and that FHS wrapper needs to create a Linux user namespace just to
# launch itself. Railway's containers don't allow unprivileged user
# namespace creation, so launching arduino-cli at all failed immediately.
#
# Fix: skip nixpkgs' wrapped build entirely and install the official
# static release binary directly (arduino's own install.sh) — the exact
# same binary already verified working locally. It's a plain Go binary
# with no FHS/namespace requirement to launch itself.
#
# Second bug, found only by actually checking the running container
# (Railway's Console tab: `ls -la /usr/local/bin`, `which arduino-cli`,
# `echo $PATH`) — the binary WAS there, correctly installed, but this
# Nixpacks image's PATH is Nix-profile-centric
# (/root/.nix-profile/bin:...:/bin:/sbin:/usr/bin:/usr/sbin) and never
# includes /usr/local/bin at all, unlike a typical Debian/Ubuntu image.
# So `spawn arduino-cli ENOENT` even though the file existed right there.
# Installing to /usr/bin instead — which the same `echo $PATH` check
# confirmed IS on this image's PATH — fixes it without needing an
# ARDUINO_CLI_PATH override in Railway's own config.
[phases.setup]
nixPkgs = ["...", "curl"]
cmds = [
  "mkdir -p /usr/bin",
  "curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/bin sh"
]
