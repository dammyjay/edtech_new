<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />

<style>
@page {
  size: A4 landscape;
  margin: 0;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow-x: hidden;
  font-family: "Georgia", serif;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

body {
  display: flex;
}

/* .certificate is always ~100% of whatever the real viewport is — the
   Puppeteer-controlled 3504px canvas for a real issued certificate
   (utils/generateCertificate.js), but also a normal browser window for
   the admin's live HTML preview (adminController.js's
   previewCertificate), and the @page box when actually printed. Those
   three are wildly different pixel widths, so every size below is in vw
   (relative to that same viewport), NOT px — a fixed px size that looks
   right at 3504px wide is either invisible or this design's own
   font-size in a ~900px browser preview. 1vw here is proportioned
   against the 3504px canvas (100vw = 3504px, so e.g. 100px there = 2.85vw). */
.certificate {
  position: relative;
  width: 100%;
  aspect-ratio: 1.414;
  margin: auto;

  background-image: url('{{BACKGROUND_URL}}');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* A single positioning context for every text line below — each line is
   independently absolutely-positioned by "top" (not stacked via normal
   flow + <br> spacers, which drifts unpredictably whenever font sizes or
   line-heights change). */
.content {
  position: absolute;
  inset: 0;
}

h1 {
  position: absolute;
  top: 14%;
  left: 0;
  right: 0;
  margin: 0;
  font-size: 2.85vw;
  letter-spacing: 0.14vw;
  font-weight: bold;
  text-align: center;
}

.intro-line,
.complete-line {
  position: absolute;
  left: 0;
  right: 0;
  margin: 0;
  font-size: 1.31vw;
  text-align: center;
  color: #2b2b2b;
}

.intro-line { top: 27%; }
.complete-line { top: 50%; }

.name {
  position: absolute;
  top: 35%;
  left: 0;
  right: 0;
  font-size: 2.63vw;
  font-weight: bold;
  text-align: center;
}

.course {
  position: absolute;
  top: 58%;
  left: 0;
  right: 0;
  font-size: 1.88vw;
  font-style: italic;
  text-align: center;
}

.bottom-section {
  position: absolute;
  bottom: 12%;
  left: 10%;
  right: 10%;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.date-block,
.signature {
  text-align: center;
  font-size: 1.14vw;
}

.date-block div:first-child {
  font-size: 0.97vw;
  color: #4a4a4a;
  margin-bottom: 0.17vw;
}

.signature img {
  width: 5.42vw;
  height: auto;
  object-fit: contain;
}

.signature-line {
  border-top: 0.06vw solid #000;
  width: 9.13vw;
  margin: 0.4vw auto 0.29vw;
}

.cert-id {
  position: absolute;
  bottom: 4%;
  left: 0;
  right: 0;
  font-size: 0.91vw;
  letter-spacing: 0.03vw;
  color: #555;
  text-align: center;
}
</style>
</head>

<body>

<div class="certificate">

  <div class="content">
    <h1>{{TITLE}}</h1>

    <p class="intro-line">This certifies that</p>

    <div class="name">{{STUDENT_NAME}}</div>

    <p class="complete-line">has successfully completed the course</p>

    <div class="course">{{COURSE_TITLE}}</div>
  </div>

  <div class="bottom-section">

    <div class="date-block">
      <div>Date</div>
      <div><strong>{{DATE}}</strong></div>
    </div>

    <div class="signature">
      <img src="{{SIGNATURE_URL}}">
      <div class="signature-line"></div>
      <div style="font-weight: bold;">{{SIGNEE_NAME}}</div>
    </div>

  </div>

  <div class="cert-id">
    Certificate ID: {{CERT_CODE}}
  </div>

</div>

</body>
</html>
