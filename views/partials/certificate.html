<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />

<style>
@page {
  size: A4 landscape;
  margin: 0;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden; /* VERY IMPORTANT */
  font-family: "Georgia", serif;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* Prevent extra spacing from p tags */
p {
  margin: 5px 0;
}

/* Force everything into exactly one page */
body {
  display: flex;
}

/* .certificate {
  position: relative;
  width: 100vw;
  height: 100vh;
  page-break-after: avoid;
  page-break-inside: avoid;
  break-after: avoid;
  break-inside: avoid;
  background-image: url('https://acad.jkthub.com/images/Certificate.png');
  background-size: 277mm 180mm;
  background-position: center;
  background-repeat: no-repeat;
} */


/* Content wrapper */
.content {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  padding: 30mm 30mm 30mm 30mm;
  box-sizing: border-box;
  text-align: center;
}

/* .certificate {
  position: relative;
  width: 3508px;
  height: 2480px;
  background-image: url('https://acad.jkthub.com/images/Certificate.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
} */

.certificate {
  position: relative;

  width: 100%;
  max-width: 1100px;   /* fit browser nicely */
  aspect-ratio: 1.414; /* A4 landscape ratio */

  margin: auto;

  background-image: url('https://acad.jkthub.com/images/Certificate.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.content {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%); 
  text-align: center;
}

/* Position elements explicitly */
/* h1 {
  position: absolute;
  top: 180px;
  left: 0;
  right: 0;
  font-size: 36px;
}

.name {
  position: absolute;
  top: 300px;
  left: 0;
  right: 0;
  font-size: 32px;
  font-weight: bold;
} */

h1 {
  position: absolute;
  top: 15%;
  left: 0;
  right: 0;
  font-size: 36px;
}

.name {
  position: absolute;
  top: 28%;
  left: 0;
  right: 0;
  font-size: 32px;
}

.course {
  position: absolute;
  top: 38%;
  left: 0;
  right: 0;
  font-size: 28px;
}

.course {
  position: absolute;
  top: 400px;
  left: 0;
  right: 0;
  font-size: 28px;
  font-style: italic;
}

.bottom-section {
  position: absolute;
  bottom: 200px; /* adjust as needed */
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  justify-content: space-around;
  width: 80%; /* gives space for signature + date */
}

/* Signature block */
.signature {
  text-align: center;
}

.signature img {
  width: 60px;
}

.signature-line {
  border-top: 1px solid #000;
  width: 200px;
  margin-top: 5px;
  margin-bottom: 5px;
}

.date-block {
  text-align: center;
}

/* .cert-id {
  position: absolute;
  bottom: 10mm;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
} */

 .cert-id {
  position: absolute;
  bottom: 5%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
}
</style>
</head>

<body>

<div class="certificate">

  <div class="content">
    <h1>CERTIFICATE OF COMPLETION</h1>

    <p>This certifies that</p>
    <br><br><br><br><br><br><br>

    <div class="name">{{STUDENT_NAME}}</div>

    <p>has successfully completed the course</p>

    <div class="course">{{COURSE_TITLE}}</div>
  </div>

  <div class="bottom-section">

    <div class="date-block">
      <div>Date</div>
      <div><strong>{{DATE}}</strong></div>
    </div>

    <div class="signature">
      <!-- <img src="/public/images/Signature.jpg" alt="Signature"> -->
       <img src="https://acad.jkthub.com/images/Signature.jpg">
      <div class="signature-line"></div>
      <div style="font-weight: bold;">Jimoh Damilola</div>
    </div>

  </div>

  <div class="cert-id">
    Certificate ID: {{CERT_CODE}}
  </div>

</div>

</body>
</html>
