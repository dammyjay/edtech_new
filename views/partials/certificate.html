<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />

<style>
@page {
  size: A4 landscape;
  margin: 0;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow-x: hidden;
  font-family: "Georgia", serif;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}


p {
  margin: 5px 0;
}

body {
  display: flex;
}

.content {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  padding: 30mm 30mm 30mm 30mm;
  box-sizing: border-box;
  text-align: center;
}

.certificate {
  position: relative;

  width: 100%;
  max-width: 1100px;   
  aspect-ratio: 1.414; 

  margin: auto;

  background-image: url('https://acad.jkthub.com/images/Certificate.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.export .certificate {
  width: 3508px;
  height: 2480px;
  max-width: none;
}

.content {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%); 
  text-align: center;
}

h1 {
  position: absolute;
  top: 15%;
  left: 0;
  right: 0;
  font-size: 36px;
}

.name {
  position: absolute;
  top: 28%;
  left: 0;
  right: 0;
  font-size: 32px;
}

.course {
  position: absolute;
  top: 38%;
  left: 0;
  right: 0;
  font-size: 28px;
  font-style: italic;
}


.bottom-section {
  position: absolute;
  bottom: 200px; 
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  justify-content: space-around;
  width: 80%; 
}

.signature {
  text-align: center;
}

.signature img {
  width: 60px;
}

.signature-line {
  border-top: 1px solid #000;
  width: 200px;
  margin-top: 5px;
  margin-bottom: 5px;
}

.date-block {
  text-align: center;
}

 .cert-id {
  position: absolute;
  bottom: 5%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
}
</style>
</head>

<body>

<div class="certificate">

  <div class="content">
    <h1>CERTIFICATE OF COMPLETION</h1>

    <p>This certifies that</p>
    <br><br><br><br><br><br><br>

    <div class="name">{{STUDENT_NAME}}</div>

    <p>has successfully completed the course</p>

    <div class="course">{{COURSE_TITLE}}</div>
  </div>

  <div class="bottom-section">

    <div class="date-block">
      <div>Date</div>
      <div><strong>{{DATE}}</strong></div>
    </div>

    <div class="signature">
       <img src="https://acad.jkthub.com/images/Signature.jpg">
      <div class="signature-line"></div>
      <div style="font-weight: bold;">Jimoh Damilola</div>
    </div>

  </div>

  <div class="cert-id">
    Certificate ID: {{CERT_CODE}}
  </div>

</div>

</body>
</html>
