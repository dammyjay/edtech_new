<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />

<style>
@page {
  size: A4 landscape;
  margin: 0;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden; /* VERY IMPORTANT */
  font-family: "Georgia", serif;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* Prevent extra spacing from p tags */
p {
  margin: 5px 0;
}

/* Force everything into exactly one page */
body {
  display: flex;
}

.certificate {
  position: relative;
  width: 100vw;
  height: 100vh;
  /* width: 297mm;
  height: 210mm; */
  page-break-after: avoid;
  page-break-inside: avoid;
  break-after: avoid;
  break-inside: avoid;
  background-image: url('https://acad.jkthub.com/images/Certificate.png');
  /* background-size: cover; */
  background-size: 277mm 180mm;
  background-position: center;
  background-repeat: no-repeat;
}
/* Content wrapper */
.content {
  position: absolute;
  /* top: 0;
  left: 0; */
  width: 100%;
  height: 100%;
  padding: 30mm 30mm 30mm 30mm;
  box-sizing: border-box;
  text-align: center;
}

/* Title */
h1 {
  font-size: 30px;
  margin-bottom: 20px;
  letter-spacing: 2px;
}

/* Student Name */
.name {
  font-size: 36px;
  font-weight: bold;
  margin: 20px 0;
  text-transform: uppercase;
}

/* Course */
.course {
  font-size: 26px;
  margin: 20px 0;
  font-style: italic;
}

/* Footer section */
.bottom-section {
  position: absolute;
  bottom: 30mm;
  left: 0;
  width: 100%;
  padding: 0 70mm;
  box-sizing: border-box;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Signature block */
.signature {
  text-align: center;
}

.signature img {
  width: 60px;
}

.signature-line {
  border-top: 1px solid #000;
  width: 200px;
  margin-top: 5px;
  margin-bottom: 5px;
}

.date-block {
  text-align: center;
}

.cert-id {
  position: absolute;
  bottom: 10mm;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
}
</style>
</head>

<body>

<div class="certificate">

  <div class="content">
    <h1>CERTIFICATE OF COMPLETION</h1>

    <p>This certifies that</p>

    <div class="name">{{STUDENT_NAME}}</div>

    <p>has successfully completed the course</p>

    <div class="course">{{COURSE_TITLE}}</div>
  </div>

  <div class="bottom-section">

    <div class="date-block">
      <div>Date</div>
      <div><strong>{{DATE}}</strong></div>
    </div>

    <div class="signature">
      <!-- <img src="/public/images/Signature.jpg" alt="Signature"> -->
       <img src="https://acad.jkthub.com/images/Signature.jpg">
      <div class="signature-line"></div>
      <div style="font-weight: bold;">Jimoh Damilola</div>
    </div>

  </div>

  <div class="cert-id">
    Certificate ID: {{CERT_CODE}}
  </div>

</div>

</body>
</html>
